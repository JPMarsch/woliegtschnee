name: Schneedaten aktualisieren

on:
  schedule:
    # Kurz nach Verfügbarkeit der GFS-Läufe (00/06/12/18 UTC + ~4 h)
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Datenquelle"
        type: choice
        options: [gfs, era5]
        default: gfs

permissions:
  contents: write

concurrency:
  group: snow-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # CDS-Warteschlange (ERA5) kann dauern
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-ingest.txt
      - run: pip install -r requirements-ingest.txt

      - name: NOAA GFS importieren
        if: ${{ (inputs.source || 'gfs') == 'gfs' }}
        run: python -m scripts.ingest_gfs

      - name: ERA5-Land importieren
        if: ${{ inputs.source == 'era5' }}
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python -m scripts.ingest_era5

      - name: Als Release „snow-data“ veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view snow-data >/dev/null 2>&1 || \
            gh release create snow-data --title "Aktuelle Schneedaten" --notes "Wird automatisch aktualisiert." --latest=false
          # Metadatei zuletzt hochladen, da der Server daran neue Daten erkennt.
          gh release upload snow-data data/snow_grid.npz data/snow_overlay.png --clobber
          gh release upload snow-data data/snow_meta.json --clobber
