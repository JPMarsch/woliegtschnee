name: Schneedaten aktualisieren

on:
  schedule:
    # Kurz nach Verfügbarkeit der GFS-Läufe (00/06/12/18 UTC + ~4 h)
    - cron: "20 4,10,16,22 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "Datenquelle"
        type: choice
        options: [gfs, era5]
        default: gfs
      backfill:
        description: "Nur GFS: zusätzlich alle Tage ab diesem Datum nachladen (YYYY-MM-DD, Archiv ab 2021), leer = nur Lücken der letzten 10 Tage"
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: snow-data
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 240   # CDS-Warteschlange (ERA5) bzw. großer Backfill
    env:
      # Bisheriger Tagesindex kommt aus dem Release, damit vorhandene Tage bleiben.
      DATA_URL: https://github.com/${{ github.repository }}/releases/download/snow-data
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements-ingest.txt
      - run: pip install -r requirements-ingest.txt

      - name: NOAA GFS importieren
        if: ${{ (inputs.source || 'gfs') == 'gfs' }}
        env:
          BACKFILL: ${{ inputs.backfill }}
        run: python -m scripts.ingest_gfs ${BACKFILL:+--backfill "$BACKFILL"}

      - name: ERA5-Land importieren
        if: ${{ inputs.source == 'era5' }}
        env:
          CDSAPI_URL: https://cds.climate.copernicus.eu/api
          CDSAPI_KEY: ${{ secrets.CDSAPI_KEY }}
        run: python -m scripts.ingest_era5

      - name: Als Release „snow-data“ veröffentlichen
        working-directory: backend/data
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shopt -s nullglob
          gh release view snow-data >/dev/null 2>&1 || \
            gh release create snow-data --title "Schneedaten" --notes "Wird automatisch aktualisiert." --latest=false
          # Nur neu erzeugte Dateien hochladen; vergangene Tage liegen schon im Release.
          # Reihenfolge: Tagesdateien und Raster → Metadatei → days.json (daran erkennt der Server Neues).
          files=(day-*.npz snow_grid.npz snow_overlay.png)
          [ ${#files[@]} -gt 0 ] && gh release upload snow-data "${files[@]}" --clobber
          gh release upload snow-data snow_meta.json --clobber
          gh release upload snow-data days.json --clobber
          # Tagesdateien entfernen, die nicht mehr im Index stehen (z. B. alte Prognosen)
          keep=$(python3 -c "import json; print(' '.join(e['file'] for e in json.load(open('days.json'))['days'] if e['file']))")
          for asset in $(gh release view snow-data --json assets --jq '.assets[].name'); do
            case "$asset" in
              day-*.npz) [[ " $keep " == *" $asset "* ]] || gh release delete-asset snow-data "$asset" -y ;;
            esac
          done
